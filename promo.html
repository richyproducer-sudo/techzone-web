<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Promocion 10% OFF</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { animation: promoPageIn 0.5s ease; }
  @keyframes promoPageIn { from { opacity: 0; } to { opacity: 1; } }
  .promo-ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .promo-ambient span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.32; animation: orbFloat 24s ease-in-out infinite; }
  .promo-ambient .orb-1 { width: 360px; height: 360px; background: var(--blue); top: -100px; left: -80px; }
  .promo-ambient .orb-2 { width: 300px; height: 300px; background: var(--green); bottom: -80px; right: -60px; animation-duration: 30s; animation-delay: -8s; }
  .promo-ambient .orb-3 { width: 240px; height: 240px; background: var(--blue-glow); top: 45%; right: 8%; animation-duration: 26s; animation-delay: -14s; }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -50px) scale(1.15); }
    66% { transform: translate(-30px, 30px) scale(0.9); }
  }
  .promo-wrap { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
  .promo-card { width: 100%; max-width: 420px; animation: promoCardIn 0.6s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes promoCardIn { from { opacity: 0; transform: translateY(24px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .promo-logo { width: 64px; height: 64px; object-fit: contain; margin-bottom: 10px; animation: promoLogoIn 0.6s cubic-bezier(.34,1.56,.64,1) both, logoBreathe 5s ease-in-out 0.6s infinite; }
  @keyframes promoLogoIn { from { opacity: 0; transform: scale(0.5) rotate(-10deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
  @keyframes logoBreathe {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(47,139,255,0)); }
    50% { filter: drop-shadow(0 0 12px rgba(47,139,255,0.6)); }
  }
  .promo-pct { font-size: 52px; font-weight: 800; color: var(--green); line-height: 1; margin: 6px 0; animation: heroTextIn 0.6s ease 0.1s both; }
  .promo-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 22px; animation: heroTextIn 0.6s ease 0.2s both; }
  @keyframes heroTextIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .promo-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; animation: boxGlow 2.6s ease-in-out infinite; }
  @keyframes boxGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
    50% { box-shadow: 0 0 26px 4px rgba(46,204,113,0.16); }
  }
  .promo-codigo { font-family: monospace; font-size: 28px; font-weight: 800; letter-spacing: 2px; color: var(--text); margin: 8px 0; word-break: break-all; animation: promoCodeIn 0.5s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes promoCodeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  .promo-terminos { font-size: 12px; color: var(--text-dim); margin-top: 18px; line-height: 1.5; }
  .promo-loading { color: var(--text-dim); }
  @media (prefers-reduced-motion: reduce) {
    .promo-ambient span, .promo-logo, .promo-box, body { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="promo-ambient"><span class="orb-1"></span><span class="orb-2"></span><span class="orb-3"></span></div>
  <div class="promo-wrap">
    <div class="promo-card">
      <img src="logo.png" class="promo-logo" alt="" />
      <div class="promo-pct" id="promo-pct-titulo">OFF</div>
      <div class="promo-sub" id="promo-sub-titulo"></div>
      <div class="promo-box" id="promo-contenido">
        <div class="promo-loading">Generando tu codigo...</div>
      </div>
      <div class="promo-terminos">
        Muestra este codigo en la tienda al momento de pagar. Valido una vez por cliente, no acumulable con otras promociones.
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module" src="promo.js"></script>
</body>
</html>
